spring.application.name=resource-booking-system

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resource_booking}
spring.datasource.username=${DB_USERNAME:brtrackrecipt}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.datatype.datetime.write-dates-as-timestamps=false

jwt.secret=${JWT_SECRET:resource-booking-local-dev-secret-key-must-be-at-least-256-bits-long}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
